server:
  port: 8080

spring:
  application:
    name: sportzone-server-user
  datasource:
    url: jdbc:mysql://localhost:3306/sport_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

aliyun:
  oss:
    endpoint: #Your key information
    access-key-id: #Your key information
    access-key-secret: #Your key information
    bucket-name: #Your key information
    domain: #Your key information

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

#springdoc:
#  api-docs:
#    path: /api-docs
#  swagger-ui:
#    path: /swagger-ui.html
#    operations-sorter: method
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
jwt:
  secret: sport-jwt-secret-key-2026-change-in-production
  expiration: 86400000

rsa:
  privateKey: |-
    
  publicKey: |-
    